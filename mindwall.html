
<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>MindWall - Login</title>
    </head>
    <body> 
        <!--Sidebar Menu-->
        <nav>
            <h2>MindWall</h2>
            <ul>
                <li><a href="mindwall.html">Home</a></li>
                <li><a href="#">My tasks</a></li>
                <li><a href="#">Friends</a></li>
            </ul>
        </nav>

        <!--Main Content-->
        <main>
            <!--Greeting and Banner-->
            <section id="greeting">
                <h1>Hello there!</h1>
                <p>Let's find the best task for your energy and time right now.</p>
            </section>

            <section id="banner">
                <p>Work with your mind, not against it. -MindWall</p>
            </section>

            <!--Task List-->
            <section id="tasks">
                <h2> Today's Tasks </h2>
                <ul>
                    <li>
                        <input type="checkbox" id="task1"/>
                        <label for="task1">Study for CS quiz</label>
                    </li>
                    <li>
                        <input type="checkbox" id="task2"/>
                        <label for="task2">Work on web project</label>
                    </li>
                </ul>

                <!--Takes the user to the timer page-->
                <form action="timer.html" method="get">
                    <button type="submit">Start Task -></button>
                </form>
            </section>
        </main>
        
        <!--Aside Content-->
        <aside>
            <section id="mood-tracker">
                <h3>How are you feeling today?</h3>
                <button>Low</button>
                <button>Medium</button>
                <button>High</button>
            </section>

            <section id="progress-widget">
                <h3> Your progress</h3>
                <p>You have completed 2 out of 5 this week.</p>
            </section>
            
        </aside>
        
    </body>
</html>
