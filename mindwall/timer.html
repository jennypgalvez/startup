<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>WallMind - Focus Timer</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css" />
</head>
<body>
    
<!------ Left Sidebar Menu ------->
    <header>
        <nav>
            <!--Logo-->
            <img src="/mindwall/images/mindwall-logo.png" alt="MindWall Logo" width="100" height="100">
            <h2>MindWall</h2>
            <ul>
                <li><a href="mindwall.html">Home</a></li>
                <li><a href="tasks.html">My tasks</a></li>
                <li><a href="friends.html">Friends</a></li>
            </ul>
        </nav>
    </header>  


    <!--------- Main Content Area (Focus Timer) --------->
    <main>
        <section>
            <h2>Focus Mode</h2>
            <p>Set your intention and start working.</p>
            
            <!-- Timer Display -->
            <div style="text-align: center; margin: 2rem 0;">
                <h1 style="font-size: 4rem; color: var(--accent-blue);">25:00</h1>
            </div>

            <!-- Timer Controls -->
            <button class="btn btn-primary">Start</button>
            <button class="btn btn-secondary">Reset</button>
         </section>

        <!-- Footer -->
        <footer>
            <hr />
            <p> Created by: Jennifer Wall</p>
            <a href="https://github.com/jennypgalvez/startup">GitHub Repository</a>
        </footer>
    </main>

    
</body>
</html>
