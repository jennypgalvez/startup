<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
        <link rel="stylesheet" href="style.css" />
        <title>MindWall - Login</title>
    </head>

    <body> 
        <!--------- Main Content Area (Login Form) --------->
        <main class="login-layout">
            <section class="login-card">
                <img src="/mindwall/images/mindwall-logo.png" alt="MindWall Logo" width="120" height="120" class="login-logo">
                <h1>Welcome to MindWall</h1>
                <p>Please log in to continue.</p>

                <form action="mindwall.html" method="get" class="login-form">
                    <div>
                        <label for="username">Username:</label>
                        <input type="text" id="username" name="username" placeholder="Enter your username">
                    </div>
                    
                    <div>
                        <label for="password">Password:</label>
                        <input type="password" id="password" name="password" placeholder="Enter your password">
                    </div>

                    <button type="submit" class="btn btn-primary">Login</button>
                    <button type="button" class="btn btn-secondary">Create Account</button>
                </form>
            </section>    

            <!--------- Footer --------->
            <footer>
                <hr />
                <p> Created by: Jennifer Wall</p>
                <a href="https://github.com/jennypgalvez/startup">GitHub Repository</a>
            </footer>
        </main>
    </body>
</html>
